<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posture Detection (PoseNet)</title>

  <!-- p5.js library -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.4.2/lib/p5.min.js"></script>

  <!-- ml5.js library -->
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin-top: 15px;
      margin-bottom: 10px;
    }

    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
    }

    #loadingScreen {
      position: fixed;
      top: 0; 
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d0d0d;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 9999;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h2>Posture Detection System</h2>

  <!-- Loading Screen -->
  <div id="loadingScreen">
    <div>⏳ Loading PoseNet Model...</div>
    <div style="font-size: 14px; margin-top: 10px; color: #aaa;">
      📸 Please grant camera permissions when prompted
    </div>
  </div>

  <script src="index.js"></script>

</body>
</html>
